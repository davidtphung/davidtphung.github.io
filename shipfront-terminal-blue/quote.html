<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Get a Quote | Shipfront</title>
<meta name="theme-color" content="#000000"/>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<link rel="stylesheet" href="lock.css"/>
</head>
<body>
<header><div class="wrap bar">
  <a class="mark" href="./" aria-label="Shipfront home">
    <span class="wordmark__lock">
    <svg class="cube" viewBox="0 0 80 80" width="24" height="26" aria-hidden="true">
      <polygon class="cube-hex" points="40,14 62,27 62,53 40,66 18,53 18,27" fill="#000000" stroke="#FF6A00" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter"/>
      <g class="cube-y" fill="none" stroke="#FF6A00" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter">
        <line x1="40" y1="40" x2="18" y2="27"/>
        <line x1="40" y1="40" x2="62" y2="27"/>
        <line x1="40" y1="40" x2="40" y2="66"/>
      </g>
    </svg>
      <span class="wordmark__name">SHIPFRONT</span>
    </span>
    <span class="wordmark__bar" aria-hidden="true"></span>
  </a>
  <nav>
    <a href="./">Home</a>
    <a class="cta" href="./quote.html">Get a Quote</a>
    <a href="./contact.html">Contact</a>
  </nav>
</div></header>
<main class="page wrap">
  <h1>Get a Quote</h1>
  <p class="lead">Tell us about your business and we'll get back to you with a custom quote.</p>
  <form method="get" action="./quote.html">
    <label for="name">Name</label>
    <input id="name" name="name" type="text" required/>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required/>
    <label for="company">Company</label>
    <input id="company" name="company" type="text" required/>
    <button class="cta" type="submit">Submit Quote Request</button>
    <p class="lead">By submitting this form, you agree to our privacy policy and terms of service. We will use your information to contact you about our services.</p>
  </form>
</main>
<footer class="wrap"><p>Built by David T Phung</p></footer>
</body>
</html>
